# character.yaml — キャラシートのフォーマット
# 1人1ファイルで characters/名前.yaml として置く。
# want / need / arc は「オープニングとクライマックスの対応」の意味的レビューの入力になる。
# 口調系フィールドはダイアログ lint(一人称の揺れ検出など)の入力になる。

name: ハルカ
age: 34
role: 姉。長女。実家を出て10年

# --- 劇的設計(シド・フィールド/キャラクターアーク) ---
want: 遺品整理を早く終わらせ、この家と縁を切ること   # 本人が自覚している欲求
need: 父を(そして弟を)赦すこと                       # 本人が自覚していない必要
arc: 「過去の抹消」から「過去との和解」へ
secret: 家を出た本当の理由を弟に話していない

# --- 口調(ダイアログ lint の入力) ---
first_person: 私            # 一人称。せりふ内でこれ以外が出たら警告
speech_register: 弟にはタメ口、叔父には敬語
verbal_tics:
  - 断定を避けて「〜じゃない?」で終わりがち
  - 感情が高ぶると急に単語だけになる
ng_words: []                # このキャラが絶対に言わない語彙(任意)
